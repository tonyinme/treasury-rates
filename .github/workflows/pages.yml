name: Refresh Treasury table

on:
  push:
    branches: [master]
  schedule:
    # A deliberate schedule edit re-enables workflows disabled by inactivity.
    # Weekdays at 23:47 UTC (5:47 p.m. MDT / 4:47 p.m. MST).
    - cron: "47 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch and validate fresh Treasury data
        env:
          TREASURY_STRICT_REFRESH: "1"
        run: python scripts/build_static.py
      - name: Save refreshed data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/treasury_auction_cache.json data/treasury_auction_history_cache.json data/treasury_daily_rates_cache.json
          if git diff --cached --quiet; then
            echo "Treasury data is unchanged."
          else
            git commit -m "Refresh Treasury data $(date -u +%F) [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
